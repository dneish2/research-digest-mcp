name: publish

# Runs when you publish a GitHub release. Builds the package and uploads it to
# PyPI with trusted publishing, so no API token is stored anywhere and PyPI
# records which workflow built each file. One-time setup on pypi.org is in
# docs/RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests must pass before anything is uploaded
        run: |
          pip install -e ".[dev]"
          python -m unittest discover -s tests
      - name: The release tag must match the package version
        run: |
          version=$(python -c "import research_digest_mcp as m; print(m.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package says $version"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
