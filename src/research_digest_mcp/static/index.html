<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research digest</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div class="header-top">
    <a class="logo" href="/">Research <span>digest</span></a>
    <button class="refresh-btn" id="refresh" title="Fetch today's papers from arXiv">Fetch</button>
    <div class="header-meta" id="header-meta"></div>
  </div>

  <div class="search-row">
    <input class="search-input" id="q" type="search"
           placeholder="Search your library, or press / to focus" autocomplete="off">
    <button class="btn" id="go">Search</button>
  </div>
  <div class="search-status" id="status"></div>

  <div class="controls-row">
    <div class="view-tabs" id="view-tabs">
      <button class="view-tab active" data-view="grid" title="Papers (1)">Papers</button>
      <button class="view-tab" data-view="digest" title="Today's picks (2)">Digest</button>
      <button class="view-tab view-tab-secondary" data-view="trends" title="Trends (3)">Trends</button>
      <button class="view-tab view-tab-secondary" data-view="queue" title="Reading queue (4)">Queue</button>
      <button class="view-tab view-tab-secondary" data-view="scoring" title="How scoring works (5)">Scoring</button>
    </div>
    <div class="filter-bar" id="filters">
      <span class="filter-label">When</span>
      <button class="chip active" data-when="all">All time</button>
      <button class="chip" data-when="today">Today</button>
      <button class="chip" data-when="week">This week</button>
      <button class="chip" data-when="saved">Saved</button>
    </div>
    <button class="sort-btn" id="sort" data-sort="score">Sort: best match</button>
  </div>
</header>

<main>
  <div class="view-panel" id="view-grid">
    <div class="welcome-hero" id="hero"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="grid-empty" hidden></div>
  </div>

  <div class="view-panel" id="view-digest" hidden></div>
  <div class="view-panel" id="view-trends" hidden></div>
  <div class="view-panel" id="view-queue" hidden></div>

  <div class="view-panel" id="view-scoring" hidden>
    <div class="lab">
      <div>
        <h2>How a paper gets ranked</h2>
        <p class="sub">Change anything here and watch the score recompute. This is the same
          function that orders the grid and the reading suggestions.</p>
        <div class="field">
          <label for="lab-topics">Your topics</label>
          <input id="lab-topics" value="agent, evaluation, multi-agent, learning">
        </div>
        <div class="field">
          <label for="lab-title">Paper title</label>
          <input id="lab-title" value="Agentic evaluation of multi-agent reasoning">
        </div>
        <div class="field">
          <label for="lab-abstract">Abstract</label>
          <textarea id="lab-abstract">We study deep learning models for agent reliability under evaluation pressure.</textarea>
        </div>
        <div class="field">
          <label for="lab-published">Published</label>
          <input id="lab-published" placeholder="YYYY-MM-DD">
        </div>
      </div>
      <div>
        <div class="card">
          <h3>The arithmetic</h3>
          <div class="formula" id="lab-formula"></div>
          <div class="why" id="lab-why"></div>
        </div>
        <div class="card">
          <h3>Words that count for less</h3>
          <p class="sub">These appear in nearly every paper here, so matching one says little.</p>
          <div class="chips" id="lab-boiler"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="detail-panel" id="panel" aria-hidden="true" aria-label="Paper detail">
  <div class="detail-head">
    <span class="detail-kicker" id="d-kicker"></span>
    <button class="panel-x" id="panel-x" aria-label="Close">&times;</button>
  </div>
  <div class="detail-body" id="d-body"></div>
</aside>

<script src="/app.js"></script>
</body>
</html>
